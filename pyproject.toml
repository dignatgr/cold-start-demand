[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldstart"
version = "0.1.0"
description = "Cold-start demand prediction for new fashion articles from attributes and image embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
]

[project.optional-dependencies]
# Image embeddings (ResNet50) and the PyTorch MLP
deep = ["torch", "torchvision", "pillow", "tqdm"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
